name: CI/CD Pipeline App Pegawai Polban

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil salinan kode sumber dari repositori
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Melakukan autentikasi ke Azure Container Registry menggunakan Secrets
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.REGISTRY_URL }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    # 3. Membangun image Docker dan mengirimkannya ke Container Registry
    - name: Build and push container image to ACR
      run: |
        docker build -t ${{ secrets.REGISTRY_URL }}/app-pegawai:latest .
        docker push ${{ secrets.REGISTRY_URL }}/app-pegawai:latest

    # 4. Memperbarui layanan Serverless Container (Azure Web App) dengan image terbaru
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: '${{ secrets.REGISTRY_URL }}/app-pegawai:latest'