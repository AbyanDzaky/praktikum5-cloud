<!DOCTYPE html>
<html>
<head>
    <title>Portal Pendaftaran Pegawai</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
    <h2>Form Pendaftaran Pegawai Baru (Versi Otomatis CI/CD)</h2>
    <form action="/submit" method="POST" enctype="multipart/form-data">
        <label>Nama Lengkap:</label><br>
        <input type="text" name="nama" required><br><br>
        
        <label>Alamat Email:</label><br>
        <input type="email" name="email" required><br><br>
        
        <label>Upload Foto KTP (Gambar):</label><br>
        <input type="file" name="ktp" accept="image/*" required><br><br>
        
        <button type="submit" style="padding: 10px 20px; background-color: #0078D4; color: white; border: none;">Submit Pendaftaran</button>
    </form>
</body>
</html>
